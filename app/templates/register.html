{% extends "base.html" %}
{% block title %}Register — Three-Tier Chat{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-mark">3-TIER</span>
            <h1>Create an account</h1>
            <p class="auth-subtitle">No email needed &mdash; this instance is a demo.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       minlength="3" maxlength="30" autocomplete="username">
                <span class="field-hint">3&ndash;30 characters.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       minlength="6" autocomplete="new-password">
                <span class="field-hint">At least 6 characters.</span>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.
        </div>
    </div>
</div>
{% endblock %}
