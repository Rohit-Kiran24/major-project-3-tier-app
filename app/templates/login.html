{% extends "base.html" %}
{% block title %}Login — Three-Tier Chat{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-mark">3-TIER</span>
            <h1>Sign in</h1>
            <p class="auth-subtitle">Chat demo for the three-tier AWS deployment.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-footer">
            No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.
        </div>
    </div>
</div>
{% endblock %}
