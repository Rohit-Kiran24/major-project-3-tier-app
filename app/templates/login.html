{% extends "base.html" %}
{% block title %}Login — Three-Tier Chat{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">💬</div>
            <h1>Three-Tier Chat</h1>
            <p class="auth-subtitle">Production-Grade AWS Architecture</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </div>

        <div class="auth-meta">
            <span class="badge badge-aws">AWS</span>
            <span class="badge badge-tier">3-Tier</span>
            <span class="badge badge-ws">WebSocket</span>
        </div>
    </div>
</div>
{% endblock %}
